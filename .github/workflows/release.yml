name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tag:
    runs-on: ubuntu-latest
    # Force-pushing the tag below (to attach the built hook bundles) needs write
    # access to repo contents; the default GITHUB_TOKEN grants that only if the repo
    # settings allow it, so it's pinned explicitly here rather than left implicit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The plugin marketplace installs directly from this git repo, and `hooks/*.mjs`
      # is gitignored (it's a build artifact, not source). Without this, a tag would
      # ship a hooks.json pointing at five files that don't exist in the tagged tree.
      # Bundles are tag-only artifacts, never committed on a branch — see
      # docs/WORLD_MODEL.md's run-3 ADR candidate for the alternatives this rejected.
      - name: Force-add built hook bundles into the tagged tree
        run: |
          git config user.name "mehmory-release"
          git config user.email "release@users.noreply.github.com"
          git add -f hooks/*.mjs
          git commit -m "chore: include built hook bundles for ${GITHUB_REF_NAME}"
          git tag -f "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME" --force

  # Publishes to the repo owner's GitHub Packages registry, not npmjs.org. The
  # package is scoped `@elderfo/*` (GitHub Packages requires the scope to match the
  # owner) and `publishConfig.registry` in package.json pins the same URL, so a local
  # `pnpm publish` lands in the same place as this job.
  #
  # No `NPM_TOKEN` secret is involved: the default `GITHUB_TOKEN` can publish packages
  # owned by this repo, given `packages: write` below. That also removes the
  # secrets-context problem the previous npmjs version worked around — there is no
  # secret to check for, so the job-level `if:` is just the tag ref.
  publish-npm:
    needs: build-tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      # `scope` is not optional here. Given `registry-url` alone, setup-node writes a
      # bare `registry=` line into the .npmrc it points NPM_CONFIG_USERCONFIG at, which
      # redirects *every* dependency resolution — including the `pnpm install` below —
      # at GitHub Packages, where the public devDependencies do not exist. With `scope`
      # it writes `@elderfo:registry=` instead, so installs keep using npmjs and only
      # this package's scope resolves to GitHub Packages. The auth token line is written
      # for the registry host either way, so publishing still authenticates.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://npm.pkg.github.com'
          scope: '@elderfo'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to GitHub Packages
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
