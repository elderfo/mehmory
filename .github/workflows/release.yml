name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # No bundle-attaching job here any more. It used to build `hooks/*.mjs` and force-push
  # them onto the tag, because the bundles were gitignored on `main`. That never reached
  # the installed plugin: the marketplace clones the **default branch**, not the tag, so
  # every marketplace install shipped a `hooks.json` pointing at five files that did not
  # exist. The bundles are now committed on `main` (A25 in docs/WORLD_MODEL.md) and the
  # tag inherits them, which also lets this workflow drop its repo-write scope entirely.
  # (Spelling that permission out here would trip the test that asserts it is gone.)

  # Publishes the unscoped `mehmory` package to npmjs.org. GitHub Packages was the
  # registry while the repo was private; it has no anonymous read, so every installer
  # needed a token of their own — untenable once the repo went public.
  #
  # `publishConfig.registry` in package.json pins the same URL as `registry-url` below,
  # so a local `pnpm publish` lands where this job lands. No `scope` is set: the package
  # is unscoped, and the bare `registry=` line setup-node writes points at npmjs, which
  # is already the default resolution target — so unlike the GitHub Packages setup, it
  # cannot misdirect the dependency install in this job.
  #
  # NPM_TOKEN is an automation token on the npmjs account. The job-level `if:` names only
  # the tag ref — `secrets` is not an allowed context there — so a missing token fails the
  # publish step loudly rather than skipping the job silently.
  publish-npm:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npmjs
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
