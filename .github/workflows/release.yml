name: Release

# release-please owns versioning. Every push to `main` with releasable Conventional Commits
# (`feat`, `fix`, or a breaking change) opens or updates one standing release PR that bumps
# `VERSION`, `package.json`, `plugin.json`, `.claude-plugin/plugin.json` and `CHANGELOG.md`.
# Merging that PR makes release-please create the `vX.Y.Z` tag and the GitHub Release, and
# `publish-npm` then publishes that tag to npm. Nobody pushes tags by hand, and a
# hand-pushed tag publishes nothing: this workflow has no tag trigger.
#
# Why the default GITHUB_TOKEN: it needs no App or stored secret, the same as the owner's
# other release-please repositories. It needs the repository setting "Allow GitHub Actions
# to create and approve pull requests". Pull requests it opens trigger no other workflows,
# so `build-test` never reports on the release PR and `main`'s ruleset blocks it: the
# owner merges release PRs with the admin bypass. The release PR changes only version
# fields and CHANGELOG.md, all generated from commits that already passed CI on `main`.
#
# Why the write permissions live on one job: opening the release PR, labelling it and
# creating the tag and Release need them, and nothing else here does. The top level grants
# nothing, and `publish-npm` reads the tagged tree only.
on:
  push:
    branches: [main]

permissions: {}

# Serialize runs so two pushes never update the release PR or cut a release at the same
# time, and never cancel a run that is partway through releasing.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # release-please labels its release PR through the issues API.
      issues: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      sha: ${{ steps.release.outputs.sha }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Publishes the unscoped `mehmory` package to npmjs.org. GitHub Packages was the
  # registry while the repo was private; it has no anonymous read, so every installer
  # needed a token of their own, untenable once the repo went public.
  #
  # `publishConfig.registry` in package.json pins the same URL as `registry-url` below,
  # so a local `pnpm publish` lands where this job lands. No `scope` is set: the package
  # is unscoped, and the bare `registry=` line setup-node writes points at npmjs, which
  # is already the default resolution target.
  #
  # NPM_TOKEN is an automation token on the npmjs account. The job-level `if:` reads only
  # release-please's outputs (`secrets` is not an allowed context there), so a missing
  # token fails the publish step loudly rather than skipping the job silently.
  #
  # Idempotency: a version already on npm is not republished. Recover a failed publish with
  # "Re-run failed jobs": a fresh run of the whole workflow sees no new release and skips it.
  publish-npm:
    runs-on: ubuntu-latest
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    permissions:
      contents: read
    steps:
      # The released commit, not the tag name: no ruleset protects tags, so a tag moved
      # after the release would otherwise choose what gets published.
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.sha }}

      - name: Check manifests match the released version
        env:
          V: ${{ needs.release-please.outputs.version }}
        run: |
          for f in VERSION package.json plugin.json .claude-plugin/plugin.json; do
            if [ "$f" = VERSION ]; then
              got=$(tr -d '[:space:]' < VERSION)
            else
              got=$(node -p "require('./$f').version")
            fi
            if [ "$got" != "$V" ]; then
              echo "::error file=$f::version is '$got', release is '$V'."
              exit 1
            fi
          done

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Check whether this version is already on npm
        id: published
        env:
          V: ${{ needs.release-please.outputs.version }}
        run: |
          # `npm view` exits non-zero with E404 for a version that was never published.
          if [ "$(npm view "mehmory@$V" version 2> /dev/null)" = "$V" ]; then
            echo "mehmory@$V is already on npm; skipping publish."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: steps.published.outputs.skip != 'true'
        run: pnpm install --frozen-lockfile

      - name: Build
        if: steps.published.outputs.skip != 'true'
        run: pnpm build

      - name: Publish to npmjs
        if: steps.published.outputs.skip != 'true'
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
