name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-tag:
    runs-on: ubuntu-latest
    # Force-pushing the tag below (to attach the built hook bundles) needs write
    # access to repo contents; the default GITHUB_TOKEN grants that only if the repo
    # settings allow it, so it's pinned explicitly here rather than left implicit.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The plugin marketplace installs directly from this git repo, and `hooks/*.mjs`
      # is gitignored (it's a build artifact, not source). Without this, a tag would
      # ship a hooks.json pointing at five files that don't exist in the tagged tree.
      # Bundles are tag-only artifacts, never committed on a branch — see
      # docs/WORLD_MODEL.md's run-3 ADR candidate for the alternatives this rejected.
      - name: Force-add built hook bundles into the tagged tree
        run: |
          git config user.name "mehmory-release"
          git config user.email "release@users.noreply.github.com"
          git add -f hooks/*.mjs
          git commit -m "chore: include built hook bundles for ${GITHUB_REF_NAME}"
          git tag -f "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME" --force

  # Publishes the unscoped `mehmory` package to npmjs.org. GitHub Packages was the
  # registry while the repo was private; it has no anonymous read, so every installer
  # needed a token of their own — untenable once the repo went public.
  #
  # `publishConfig.registry` in package.json pins the same URL as `registry-url` below,
  # so a local `pnpm publish` lands where this job lands. No `scope` is set: the package
  # is unscoped, and the bare `registry=` line setup-node writes points at npmjs, which
  # is already the default resolution target — so unlike the GitHub Packages setup, it
  # cannot misdirect the dependency install in this job.
  #
  # NPM_TOKEN is an automation token on the npmjs account. The job-level `if:` names only
  # the tag ref — `secrets` is not an allowed context there — so a missing token fails the
  # publish step loudly rather than skipping the job silently.
  publish-npm:
    needs: build-tag
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          registry-url: 'https://registry.npmjs.org'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Publish to npmjs
        run: pnpm publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
