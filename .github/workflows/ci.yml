name: CI

on:
  push:
    branches: [main]
  pull_request:

# Fork pull requests run this workflow. Nothing here needs the token for anything beyond
# reading the checked-out code, so say so explicitly rather than inheriting the repo default.
permissions: {}

jobs:
  build-test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm

      - name: Lint workflows
        run: |
          # Pinned release tarball rather than a third-party action: this step needs no
          # repository token, and the workflow files are the one thing in CI that nothing
          # else checks. Catches what YAML parsing cannot — e.g. a `secrets` reference in a
          # job-level `if:`, which is valid YAML, invalid GitHub Actions, and fails the
          # whole workflow to load rather than skipping the job.
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            | tar xz actionlint
          ./actionlint -color

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # The hook bundles under `hooks/*.mjs` are committed, not gitignored, because the
      # plugin marketplace installs from this repo's default branch (A25 in
      # docs/WORLD_MODEL.md). Committed build output goes stale silently, so the build
      # above must reproduce the committed bytes exactly. `git status --porcelain` is
      # used rather than `git diff --exit-code` on purpose: it also catches a *new*
      # content-hashed `chunk-*.mjs` that `git diff` would ignore as untracked, and a
      # stale one left behind by the hooks build's `clean: false`.
      - name: Check committed hook bundles are up to date
        run: |
          if [ -n "$(git status --porcelain -- hooks/)" ]; then
            echo "::error::hooks/ differs from a clean build of src/hooks/*.ts."
            echo "Run 'pnpm build' and commit the resulting hooks/*.mjs."
            git status --porcelain -- hooks/
            git diff -- hooks/ | head -100
            exit 1
          fi

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm typecheck
